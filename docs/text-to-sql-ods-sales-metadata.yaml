domain: ods_sales_inventory
domain_description: >
  ODS 层销售与库存数据域。当前适合优先支持销售趋势、渠道销售、商品销售、
  库存数量、可用库存、品牌库存、批次效期等经营分析问题。

source:
  schema: ods
  inspected_at: 2026-07-11
  notes:
    - 仅基于 information_schema 与聚合画像整理，未抽取业务明细样本。
    - 订单头使用 dwd.销售单查询_进口超市上海仓补全；销售明细使用 dwd.销售单明细账_品牌补全。
    - ods.销售单查询和 ods.销售单明细账仅作为原始数据保留。
    - 未指定明细维度的总销售额使用销售单查询.实付金额；商品、品牌、品类、渠道或客户维度使用销售单明细账.分摊后金额。
    - 订单实付金额与明细分摊销售额不强制相等，差额不代表平台抽成。
    - 有效订单默认只排除已取消、已取消-被合并、已取消-被拆分，其他订单状态均计入。
    - 售后退货、售后发货进入销售指标，不单独排除。

tables:
