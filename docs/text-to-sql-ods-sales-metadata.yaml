    row_count_observed: 463235
    grain: 一行一笔销售单
    primary_key_candidate: 订单编号
    time_range_observed:
      下单时间: "2026-06-06 17:59:34 ~ 2026-07-10 10:30:04"
      付款时间: "2026-06-06 17:59:34 ~ 2026-07-10 10:30:05"
      updatetime: "2026-07-06 17:59:30 ~ 2026-07-10 10:31:09"
