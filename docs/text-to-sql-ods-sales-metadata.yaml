relationships:
  - from: 销售单明细账.订单编号
    to: 销售单查询.订单编号
    type: many_to_one
    confidence: medium
    description: 明细账按订单编号关联订单头；因字段类型为 text，需注意重复与清洗问题。
  - from: 销售单明细账.货品编号
    to: 总库存查询.货品编号
    type: many_to_one
    confidence: medium
    description: 销售明细与库存表按货品编号关联，用于商品销售与库存联动分析。
  - from: 销售单明细账.货品编号
    to: 分仓库查询.货品编号
    type: many_to_many
    confidence: medium
    description: 按货品编号关联分仓库存；如同时分析仓库，应结合发货仓库/仓库字段。
  - from: 销售单明细账.货品编号
    to: 批次货品库存查询.货品编号
    type: many_to_many
    confidence: medium
    description: 按货品编号关联批次库存，用于销售与效期联动分析。
  - from: 销售单明细账.销售渠道
    to: 渠道列表.渠道名称
    type: many_to_one
    confidence: low
    description: 可尝试按渠道名称关联，但名称是否完全一致需要进一步校验。

metrics:
  - name: 订单数
    aliases: [销售单数, 成交订单数]
    description: 有效销售单数量。
    formula: count(distinct 销售单查询.订单编号)
    filters:
      - 销售单查询.订单状态 not in ('已取消', '已取消-被合并', '已取消-被拆分')
    default_time_field: 销售单查询.下单时间

  - name: 订单头实付金额
    aliases: [实付销售额, 实付金额, 成交金额]
    description: 订单头表中有效订单的实付金额合计。用于未指定商品、品牌、品类、渠道或客户等明细维度的总销售额和订单实付分析。
    formula: sum(销售单查询.实付金额)
    filters:
      - 销售单查询.订单状态 not in ('已取消', '已取消-被合并', '已取消-被拆分')
    default_time_field: 销售单查询.下单时间

  - name: 应收金额
    aliases: [应收合计]
    description: 订单头表中有效订单的应收合计。
    formula: sum(销售单查询.应收合计)
    filters:
      - 销售单查询.订单状态 not in ('已取消', '已取消-被合并', '已取消-被拆分')
    default_time_field: 销售单查询.下单时间

  - name: 销售额
    aliases: [商品销售额, 明细销售额, 分摊后销售额, 成交金额]
    description: 明细分摊销售额口径，用于商品、品牌、品类、渠道或客户维度；售后退货、售后发货进入销售指标。
    formula: sum(销售单明细账.分摊后金额)
    filters: []
    default_time_field: 销售单明细账.下单时间

  - name: 商品销量
    aliases: [销量, 销售件数, 件数]
    description: 销售明细表中的商品数量合计。
    formula: sum(销售单明细账.数量)
    filters: []
    default_time_field: 销售单明细账.下单时间

  - name: 毛利
    aliases: [毛利额]
    description: 销售明细表中的毛利合计。
    formula: sum(销售单明细账.毛利)
    filters: []
    default_time_field: 销售单明细账.下单时间

  - name: 毛利率
    aliases: [整体毛利率]
    description: 毛利合计除以分摊后金额合计。
    formula: sum(销售单明细账.毛利) / nullif(sum(销售单明细账.分摊后金额), 0)
    filters: []
    default_time_field: 销售单明细账.下单时间

  - name: 当前库存
    aliases: [库存, 总库存, 库存数量]
    description: 当前库存数量合计。
    formula: sum(总库存查询.库存数量)
    filters: []
    default_time_field: 总库存查询.updatetime

  - name: 可用库存
    aliases: [可售库存]
    description: 当前可用库存数量合计。
    formula: sum(总库存查询.可用库存)
    filters: []
    default_time_field: 总库存查询.updatetime

  - name: 近30天库存销量
    aliases: [近30天销量, 30天销量]
    description: 库存表记录的近 30 天销量合计。
    formula: sum(总库存查询.近30天销量)
    filters: []
    default_time_field: 总库存查询.updatetime

business_terms:
  - term: 有效订单
    type: filter
    description: 默认只排除已取消、已取消-被合并、已取消-被拆分，其他订单状态均计入。
  - term: 销售额
    type: metric_alias
    maps_to: 销售额
    description: 未指定明细维度时映射到订单头实付金额；按商品、品牌、品类、渠道或客户分析时映射到明细分摊销售额。
  - term: 售后
    type: filter_rule
    description: 售后退货、售后发货进入销售指标，不从默认销售额、销量、毛利等指标中排除。
  - term: 商品
    type: dimension
    maps_to: 销售单明细账.货品名称 或 总库存查询.货品名称
  - term: SKU
    type: dimension
    maps_to: 销售单明细账.货品编号 或 总库存查询.货品编号
  - term: 渠道
    type: dimension
    maps_to: 销售单明细账.销售渠道 或 销售单查询.销售渠道
  - term: 品类
    type: dimension
    maps_to: 销售单明细账.货品分类 或 总库存查询.货品分类
  - term: 仓库
    type: dimension
    maps_to: 销售单明细账.发货仓库 或 总库存查询.仓库

query_examples:
  - question: 今年每个月商品销售额和销量是多少？
    sql: |
      select
        date_format(`下单时间`, '%Y-%m') as month,
        sum(`分摊后金额`) as sales_amount,
        sum(`数量`) as quantity
      from dwd.`销售单明细账_品牌补全`
      where `下单时间` >= '2026-01-01'
        and `下单时间` < '2027-01-01'
      group by date_format(`下单时间`, '%Y-%m')
      order by month;

  - question: 近30天各品牌销售额排名前10是什么？
    sql: |
      select
        `品牌`,
        sum(`分摊后金额`) as sales_amount,
        sum(`数量`) as quantity
      from dwd.`销售单明细账_品牌补全`
      where `下单时间` >= current_date - interval 30 day
      group by `品牌`
      order by sales_amount desc
      limit 10;

  - question: 昨天各渠道分类的订单实付金额是多少？
    sql: |
      select
        `渠道分类`,
        sum(`实付金额`) as paid_amount,
        count(distinct `订单编号`) as order_count
      from dwd.`销售单查询_进口超市上海仓补全`
      where `订单状态` not in ('已取消', '已取消-被合并', '已取消-被拆分')
        and `下单时间` >= current_date - interval 1 day
        and `下单时间` < current_date
      group by `渠道分类`
      order by paid_amount desc;

  - question: 当前各品牌库存和可用库存是多少？
    sql: |
      select
        `品牌`,
        sum(`库存数量`) as stock_quantity,
        sum(`可用库存`) as available_stock
      from ods.`总库存查询`
      group by `品牌`
      order by stock_quantity desc;

  - question: 哪些商品剩余有效天数小于30天？
    sql: |
      select
        `仓库`,
        `货品编号`,
        `货品名称`,
        `品牌`,
        `批次`,
        `库存数量`,
        `生产日期`,
        `到期日期`,
        `剩余有效天数`
      from ods.`批次货品库存查询`
      where `剩余有效天数` < 30
      order by `剩余有效天数` asc, `库存数量` desc;

