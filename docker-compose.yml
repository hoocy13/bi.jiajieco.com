services:
  backend:
    build:
      context: ./backend
    container_name: jjc-bi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/data/bi_admin.db
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: jjc-bi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:18080:80"

volumes:
  backend_data:
