name: Deploy BI

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Tencent Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=backend/.venv \
            --exclude=backend/__pycache__ \
            --exclude=backend/*.db \
            --exclude=backend/.env \
            -czf "$RUNNER_TEMP/bi-deploy.tar.gz" .

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload archive
        env:
          ADS_BUILD_DATABASE_URL: ${{ secrets.ADS_BUILD_DATABASE_URL }}
          DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
          DEPLOY_USER: ${{ secrets.TENCENT_USER }}
        run: |
          if [ -z "$ADS_BUILD_DATABASE_URL" ]; then
            echo "Missing ADS_BUILD_DATABASE_URL repository secret"
            exit 1
          fi
          umask 077
          printf '%s' "$ADS_BUILD_DATABASE_URL" > "$RUNNER_TEMP/ads-build-url"
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/bi-deploy.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/root/bi-deploy.tar.gz"
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/ads-build-url" "$DEPLOY_USER@$DEPLOY_HOST:/root/bi-ads-build-url"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
          DEPLOY_USER: ${{ secrets.TENCENT_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -e

          APP_DIR="/www/wwwroot/bi.jiajieco.com"
          ARCHIVE="/root/bi-deploy.tar.gz"
          ADS_BUILD_SECRET_FILE="/root/bi-ads-build-url"
          TS=$(date +%Y%m%d%H%M%S)
          RELEASE="/www/wwwroot/bi.jiajieco.com.release.$TS"
          BACKUP="/www/wwwroot/bi.jiajieco.com.backup.$TS"
          FAILED="/www/wwwroot/bi.jiajieco.com.failed.$TS"

          rollback() {
            exit_code=$?
            rm -f "$ADS_BUILD_SECRET_FILE"
            if [ "$exit_code" -ne 0 ] && [ -d "$BACKUP" ]; then
              echo "Deploy failed; restoring previous release."
              if [ -d "$APP_DIR" ]; then
                cd "$APP_DIR"
                docker compose down || true
                cd /www/wwwroot
                mv "$APP_DIR" "$FAILED"
              fi
              mv "$BACKUP" "$APP_DIR"
              cd "$APP_DIR"
              docker compose up -d --build || true
              echo "Rollback finished."
            fi
            exit "$exit_code"
          }
          trap rollback ERR

          mkdir -p "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"

          if [ -f "$APP_DIR/backend/.env" ]; then
            mkdir -p "$RELEASE/backend"
            cp "$APP_DIR/backend/.env" "$RELEASE/backend/.env"
          fi

          ENV_FILE="$RELEASE/backend/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing production backend/.env"
            exit 1
          fi
          if [ ! -s "$ADS_BUILD_SECRET_FILE" ]; then
            echo "Missing uploaded ADS build credential"
            exit 1
          fi

          ods_line=$(grep '^ODS_DATABASE_URL=' "$ENV_FILE" | tail -n 1 || true)
          if [ -z "$ods_line" ]; then
            echo "Missing ODS_DATABASE_URL in production backend/.env"
            exit 1
          fi
          ods_value=${ods_line#*=}
          ads_value=$(printf '%s' "$ods_value" | sed 's#/ods?#/ads?#')
          if [ "$ads_value" = "$ods_value" ]; then
            echo "Could not derive ADS_DATABASE_URL from ODS_DATABASE_URL"
            exit 1
          fi
          ads_build_value=$(cat "$ADS_BUILD_SECRET_FILE")
          rm -f "$ADS_BUILD_SECRET_FILE"

          sed -i '/^ADS_DATABASE_URL=/d; /^ADS_BUILD_DATABASE_URL=/d; /^BI_QUERY_SOURCE=/d' "$ENV_FILE"
          {
            printf '\nADS_DATABASE_URL=%s\n' "$ads_value"
            printf 'ADS_BUILD_DATABASE_URL=%s\n' "$ads_build_value"
            printf 'BI_QUERY_SOURCE=ads\n'
          } >> "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          if [ -d "$APP_DIR" ]; then
            mv "$APP_DIR" "$BACKUP"
          fi

          mv "$RELEASE" "$APP_DIR"
          cd "$APP_DIR"

          docker compose up -d --build
          docker compose ps

          for i in $(seq 1 15); do
            if curl -fsSI http://127.0.0.1:18080 >/dev/null \
              && curl -fsS http://127.0.0.1:18080/api/v1/openapi.json >/dev/null; then
              echo "Frontend and API health checks passed."
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "Frontend or API health check failed after retries."
              docker compose logs --tail=80 backend
              docker compose logs --tail=80 frontend
              exit 1
            fi

            sleep 2
          done

          docker compose exec -T backend python -m app.jobs.build_sales_ads < /dev/null

          docker compose exec -T backend python - <<'PY'
          import urllib.request

          from app.core.security import create_access_token
          from app.db.session import SessionLocal
          from app.models.user import User

          with SessionLocal() as db:
              user = db.query(User).filter(User.is_active.is_(True)).first()
          if user is None:
              raise SystemExit("No active user available for authenticated health check")

          token = create_access_token(subject=user.username)

          def check_ads_endpoint(path: str, label: str) -> None:
              request = urllib.request.Request(
                  f"http://127.0.0.1:8000{path}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  query_mode = response.headers.get("X-BI-Query-Mode")
                  response_source = response.headers.get("X-BI-Response-Source")
                  server_timing = response.headers.get("Server-Timing")

              if query_mode != "ads" or response_source != "ads":
                  raise SystemExit(
                      f"{label} ADS health check failed: "
                      f"mode={query_mode} source={response_source}"
                  )
              print(
                  f"{label} ADS health check passed: "
                  f"mode=ads source=ads server_timing={server_timing or 'unknown'}"
              )

          check_ads_endpoint("/api/v1/sales/overview?range=last_30", "sales_overview")
          check_ads_endpoint("/api/v1/sales/product-rank?range=last_30&limit=30", "sales_product_rank")
          check_ads_endpoint("/api/v1/sales/brand-analysis?range=this_year&limit=30", "sales_brand_analysis")
          check_ads_endpoint("/api/v1/sales/channel-analysis?range=this_year", "sales_channel_analysis")
          check_ads_endpoint("/api/v1/dashboard/overview", "dashboard_overview")
          PY

          install -m 0644 ops/bi-sales-ads.cron /etc/cron.d/bi-sales-ads

          trap - ERR
          echo "Deploy finished."
          echo "Backup: $BACKUP"
          REMOTE
